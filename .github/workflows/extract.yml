name: Extract Tar

on:
  workflow_dispatch: # Isse aapko manual "Run" button milega

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract files
        run: |
          mkdir extracted_files
          tar -xvf ok.tar -C extracted_files

      - name: Commit and push extracted files
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add extracted_files
          git commit -m "Extracted tar files automatically"
          git push
